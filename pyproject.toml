[project]
name = "rlmagent"
version = "0.2.0"
readme = "README.md"
description = "A terminal coding agent with a persistent Python kernel and recursive sub-agents."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kartik G" }]
keywords = ["agent", "cli", "coding-agent", "llm", "tui", "recursive-language-models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "packaging>=24",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "httpx[socks]>=0.27",
    "textual>=8.2.8",
    "ipykernel>=6.29",
    "jupyter_client>=8.6",
    "psutil>=5.9",
    "tzdata; sys_platform == 'win32'",
    "rlmness>=0.2.3",
]

[project.optional-dependencies]
vertex = ["google-auth[requests]>=2.0"]
mcp-keyring = ["keyring>=25"]
subscription = ["keyring>=25", "PyJWT[crypto]>=2.10,<3", "websockets>=15,<17"]
copilot = ["github-copilot-sdk>=1.0.28,<2"]

[project.urls]
Homepage = "https://github.com/kartikg-gk/rlmagent"
Repository = "https://github.com/kartikg-gk/rlmagent"
Issues = "https://github.com/kartikg-gk/rlmagent/issues"

[project.scripts]
rlm-agent = "rlmagent.cli.main:main"

[dependency-groups]
# Development tools; installed by `uv sync`, never part of the published package.
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Ship only what a consumer needs.
include = ["/src/rlmagent", "/LICENSE", "/README.md", "/pyproject.toml"]
exclude = ["__pycache__", "*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["src/rlmagent"]

[tool.hatch.build]
# Editable installs expose all of src/.
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["e2e: real tasks against a real model; run with RLM_AGENT_E2E=1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures carry long canned payloads and expected-completion strings.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
